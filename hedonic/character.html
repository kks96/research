<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Character Chat</title>
  <style>
    :root{
      /* Hedonic / character.ai-ish palette */
      --bg0:#07070c;
      --bg1:#0b1024;

      --card: rgba(18, 18, 30, .58);
      --card2: rgba(26, 24, 44, .58);
      --line: rgba(255,255,255,.12);

      --text:#f5f6ff;
      --muted: rgba(240,245,255,.68);

      --me: rgba(56, 189, 248, .16);
      --bot: rgba(236, 72, 153, .14);

      --pink: rgba(236,72,153,.95);
      --violet: rgba(139,92,246,.95);
      --cyan: rgba(56,189,248,.92);
      --lime: rgba(132,204,22,.90);

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 15% 5%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 15%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 700px at 50% 100%, rgba(139,92,246,.15), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow:hidden;
      overflow-y: auto;
    }

    /* floating bokeh */
    .bokeh{
      position:fixed; inset:0; pointer-events:none; opacity:.65;
      filter: blur(0px);
      background:
        radial-gradient(80px 80px at 10% 20%, rgba(236,72,153,.22), transparent 60%),
        radial-gradient(120px 120px at 70% 15%, rgba(56,189,248,.20), transparent 60%),
        radial-gradient(110px 110px at 85% 65%, rgba(139,92,246,.18), transparent 60%),
        radial-gradient(140px 140px at 20% 80%, rgba(132,204,22,.12), transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }
    @keyframes drift{
      0%{transform:translate3d(0,0,0) scale(1)}
      100%{transform:translate3d(-12px, 10px,0) scale(1.03)}
    }
    html, body { height: 100%; }
    body { margin:0; }
    
    .wrap{
      max-width: 980px;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    /* Main card */
    .card{
      width: 100%;
      max-width: 980px;
      height: 100%;
      min-height: 520px; 
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(140%);
      overflow:hidden;
      position:relative;
    }

    /* animated gradient edge */
    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        conic-gradient(from 180deg at 50% 50%,
          rgba(236,72,153,.55),
          rgba(139,92,246,.55),
          rgba(56,189,248,.55),
          rgba(132,204,22,.30),
          rgba(236,72,153,.55)
        );
      filter: blur(10px);
      opacity:.22;
      z-index:0;
      animation: spin 10s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .cardInner{
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(12,12,22,.78), rgba(8,8,14,.86));
      z-index:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    /* top bar */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(900px 240px at 10% 0%, rgba(236,72,153,.18), transparent 55%),
        radial-gradient(900px 240px at 90% 0%, rgba(56,189,248,.14), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      flex:0 0 auto;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .brandIcon{
      width:40px; height:40px; border-radius:14px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(236,72,153,.60), transparent 65%),
        radial-gradient(18px 18px at 70% 30%, rgba(56,189,248,.55), transparent 65%),
        radial-gradient(18px 18px at 50% 70%, rgba(139,92,246,.55), transparent 65%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      box-shadow: 0 12px 30px rgba(0,0,0,.40);
    }

    .brandText{min-width:0}
    .brandTitle{
      font-weight:900;
      letter-spacing:-.3px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chip{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      font-weight:800;
      font-size:12px;
      color: rgba(245,246,255,.92);
      cursor:pointer;
      user-select:none;
    }
    .chip:hover{filter:brightness(1.08)}

    /* Main area layout */
    .main{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns: 1fr;
    }

    /* Chat panel */
    .panel{
      display:flex;
      flex-direction:column;
      height:100%;
      min-width:0;
      min-height:0;
    }

    .log{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:16px;
      background:
        radial-gradient(900px 600px at 30% 0%, rgba(236,72,153,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(56,189,248,.08), transparent 55%),
        linear-gradient(180deg, rgba(6,7,14,.55), rgba(6,7,14,.80));
      scroll-behavior: smooth;
    }

    .row{display:flex; gap:10px; margin:10px 0; align-items:flex-end}
    .row.me{justify-content:flex-end}
    .row > div{min-width:0}

    .avatar{
      width:38px;height:38px;
      border-radius:14px;
      flex:0 0 auto;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      box-shadow: 0 14px 32px rgba(0,0,0,.35);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    .bubble{
      display: inline-block;
      width: auto;
      max-width: 100%;
      min-width: 0;
      padding:12px 14px;
      border-radius: 18px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:normal;
      color:var(--text);
      border:1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
      overflow-wrap: break-word;
    }
    .row.bot .bubble{
      background:
        radial-gradient(300px 140px at 20% 0%, rgba(236,72,153,.18), transparent 70%),
        linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    }
    .row.me .bubble{
      background:
        radial-gradient(300px 140px at 80% 0%, rgba(56,189,248,.16), transparent 70%),
        linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-color: rgba(56,189,248,.22);
    }

    .meta{
      margin-top:6px;
      font-size:11px;
      color: rgba(240,245,255,.62);
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .actionBtn{
      padding:9px 12px;
      border-radius:999px;
      cursor:pointer;
      font-weight:900;
      color: rgba(245,246,255,.95);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 22px rgba(0,0,0,.26);
      max-width: 100%;
      min-width: 0;
      flex: 1 1 auto;
      white-space: normal;
      overflow-wrap: anywhere;
      transition: all 0.2s;
    }
    @media (max-width: 480px){
      .wrap{
        transform: scale(0.92);
        transform-origin: top center;
      }
      .log{
        max-height: 460px;
      }
      textarea.input{
        font-size: 13px;
        min-height: 44px;
      }
      .btn{
        padding: 10px 12px;
      }
    }
    .actionBtn.primary{
      border:none;
      background: linear-gradient(135deg, rgba(236,72,153,.95), rgba(56,189,248,.92));
      box-shadow: 0 16px 34px rgba(236,72,153,.16);
    }
    .actionBtn:hover:not(:disabled){filter:brightness(1.1); transform:translateY(-1px);}
    .actionBtn:disabled{opacity:0.5; cursor:not-allowed;}

    /* composer */
    .composer{
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex:0 0 auto;
    }

    textarea.input{
      flex:1;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      outline:none;
      font-size:14px;
      resize:none;
      line-height:1.4;
      min-height:52px;
      color:var(--text);
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 0 0 1px rgba(139,92,246,.08);
      transition: all 0.3s;
    }
    textarea.input::placeholder{color: rgba(240,245,255,.42)}
    textarea.input:disabled { opacity: 0.5; background: rgba(0,0,0,0.2); cursor: not-allowed; }

    .btn{
      padding:12px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:950;
      color:#fff;
      background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(236,72,153,.95));
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 16px 40px rgba(139,92,246,.20);
      transition: all 0.3s;
    }
    .btn:hover:not(:disabled){filter:brightness(1.1); transform:scale(1.02);}
    .btn:disabled{opacity:.4; cursor:not-allowed; filter:grayscale(0.5);}

    /* typing */
    .typing{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:10px 12px;
      border-radius:16px;
      background: rgba(236,72,153,.14);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
    }
    .dot{
      width:6px;height:6px;border-radius:999px;
      background: radial-gradient(circle, rgba(251,207,232,1), rgba(236,72,153,1));
      box-shadow: 0 0 10px rgba(236,72,153,.55);
      animation:bounce 1.05s infinite ease-in-out;
      opacity:.9
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-6px);opacity:1}}

    /* toast */
    .toast{
      position:absolute;
      bottom:16px; left:50%;
      transform:translateX(-50%);
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(16,16,28,.65);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      font-size:12px;
      color: rgba(245,246,255,.86);
      display:none;
      z-index:6;
    }
  </style>
</head>

<body>
  <div class="bokeh"></div>

  <div class="wrap">
    <div class="card" id="card">
      <div class="cardInner">

        <div class="topbar">
          <div class="brand">
            <div class="brandIcon" aria-hidden="true">✨</div>
            <div class="brandText">
              <div class="brandTitle" id="appTitle">AI Character Chatbot</div>
            </div>
          </div>

          <div class="chip" id="resetBtn" title="Reset">
            <span>↻</span><span>Reset</span>
          </div>
        </div>

        <div class="main">
          <section class="panel">
            <div class="log" id="log"></div>

            <div class="composer">
              <textarea class="input" id="msg" rows="2"
                placeholder='Enter = send, Shift+Enter = new line. Example: "pick", "Luna", or "Jax".'></textarea>
              <button class="btn" id="send">Send</button>
            </div>
          </section>
        </div>

        <div class="toast" id="toast"></div>

      </div>
    </div>
  </div>

<script>
(function(){
  // ========= Utility =========
  const $ = (id)=>document.getElementById(id);
  const log = $("log");
  const msg = $("msg");
  const send = $("send");
  const resetBtn = $("resetBtn");
  const toast = $("toast");

  function nowTime(){
    const d = new Date();
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }
  function normalize(text){
    return (text||"").trim().toLowerCase().replace(/\s+/g," ");
  }
  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  function showToast(text){
    if(!toast) return;
    toast.textContent = text;
    toast.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.style.display="none", 1800);
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function lockChat(reason = "Chat locked.") {
    msg.disabled = true;
    send.disabled = true;
    msg.placeholder = reason;
    
    const actionBtns = log.querySelectorAll('.actionBtn');
    actionBtns.forEach(btn => {
      btn.disabled = true;
    });
  }

  function unlockChat() {
    msg.disabled = false;
    send.disabled = false;
    msg.placeholder = 'Enter = send, Shift+Enter = new line. Example: "pick", "Luna", or "Jax".';
  }

  // ========= Characters =========
  function svgAvatarDataURI({bgA,bgB,emoji,accent}){
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="${bgA}"/>
            <stop offset="1" stop-color="${bgB}"/>
          </linearGradient>
          <radialGradient id="r" cx="30%" cy="25%" r="70%">
            <stop offset="0" stop-color="${accent}" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="128" height="128" rx="34" fill="url(#g)"/>
        <rect width="128" height="128" rx="34" fill="url(#r)"/>
        <circle cx="64" cy="70" r="36" fill="rgba(255,255,255,0.88)"/>
        <text x="64" y="78" font-size="40" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
      </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
  }

  const Characters = [
    {
      id: "luna",
      name: "Luna",
      tagline: "Princess of Everglass Castle",
      description: "Regal, warm, and playful in a gentle way.",
      avatar: svgAvatarDataURI({ bgA:"#ec4899", bgB:"#8b5cf6", emoji:"👑", accent:"#fbcfe8" }),
      voice: { prefix: "Luna 👑" }
    },
    {
      id: "jax",
      name: "Jax",
      tagline: "Neon Club DJ & Hype Captain",
      description: "Fast, upbeat, and rhythm-obsessed.",
      avatar: svgAvatarDataURI({ bgA:"#38bdf8", bgB:"#22c55e", emoji:"🎧", accent:"#cffafe" }),
      voice: { prefix: "Jax 🎧" }
    }
  ];

  let activeChar = null;
  let typingRowEl = null;
  let conversationMode = "casual";
  let awaitingPick = true;
  
  // ✨ 추가: 무한 루프를 위한 전역 인덱스 변수
  let currentGifIndex = 0;

  // ========= Character helpers =========
  function getIntroForCharacter(ch){
    if(ch.id === "luna"){
      return `Welcome to Everglass Castle.\nTell me your purpose, and I shall respond with grace—wisdom, whimsy, or a playful quest.`;
    }
    if(ch.id === "jax"){
      return `Yo—mic check! Welcome to the Neon Booth.\nGive me a topic and a vibe—chill, hype, or storytelling—and I’ll remix it.`;
    }
    return `Hello.`;
  }

  function setActiveCharacter(charId){
    const ch = Characters.find(c => c.id === charId);
    if(!ch) return;
    activeChar = ch;
    awaitingPick = false;
    currentGifIndex = 0; // 캐릭터 변경 시 GIF 순서도 처음으로 리셋
    addSystemRow(`You are now chatting with ${ch.name}.`);
    botSay(getIntroForCharacter(ch));
  }

  // ========= Chat rendering =========
  function addRow({who, text, avatarUrl, actions=[], media=null}){
    const row = document.createElement("div");
    row.className = "row " + (who === "me" ? "me" : "bot");

    if(who === "bot"){
      const av = document.createElement("div");
      av.className = "avatar";
      const img = document.createElement("img");
      img.alt = (activeChar ? activeChar.name : "Bot");
      img.src = avatarUrl || (activeChar ? activeChar.avatar : Characters[0].avatar);
      av.appendChild(img);
      row.appendChild(av);
    }

    const wrap = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(text){
      const t = document.createElement("div");
      t.textContent = text;
      t.style.whiteSpace = "pre-wrap";
      bubble.appendChild(t);
    }

    if(media && media.type === "gif" && media.src && !media.src.includes("YOUR_")){
      const img = document.createElement("img");
      img.src = media.src;
      img.alt = media.alt || "gif";
      img.loading = "lazy";
      img.style.display = "block";
      img.style.maxWidth = "260px";
      img.style.width = "100%";
      img.style.borderRadius = "14px";
      img.style.marginTop = text ? "10px" : "0";
      img.style.border = "1px solid rgba(255,255,255,.12)";
      bubble.appendChild(img);
    }

    if(who === "bot" && actions.length){
      const actionsEl = document.createElement("div");
      actionsEl.className = "actions";
      actions.forEach(a => {
        const b = document.createElement("button");
        b.className = "actionBtn " + (a.primary ? "primary" : "");
        b.textContent = a.label;
        b.onclick = () => {
          if (b.disabled) return;
          addRow({who:"me", text: a.label});
          respond("@choice:" + (a.value || a.label));
        };
        actionsEl.appendChild(b);
      });
      bubble.appendChild(actionsEl);
    }

    wrap.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = nowTime();
    wrap.appendChild(meta);

    row.appendChild(wrap);
    log.appendChild(row);
    
    setTimeout(() => {
      log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
    }, 10);
  }

  function addSystemRow(text){
    const row = document.createElement("div");
    row.className = "row bot";
    const wrap = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    bubble.style.opacity = ".85";
    bubble.style.fontSize = "13px";
    bubble.style.borderStyle = "dashed";
    bubble.style.background = "rgba(255,255,255,.04)";
    wrap.appendChild(bubble);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = nowTime();
    wrap.appendChild(meta);
    row.appendChild(wrap);
    log.appendChild(row);
    log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
  }

  function showTyping(){
    if(typingRowEl) return;
    const row = document.createElement("div");
    row.className = "row bot";

    const av = document.createElement("div");
    av.className = "avatar";
    const img = document.createElement("img");
    img.alt = (activeChar ? activeChar.name : "Bot");
    img.src = activeChar ? activeChar.avatar : Characters[0].avatar;
    av.appendChild(img);

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;

    row.appendChild(av);
    row.appendChild(typing);
    typingRowEl = row;
    log.appendChild(row);
    log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
  }

  function hideTyping(){
    if(!typingRowEl) return;
    typingRowEl.remove();
    typingRowEl = null;
  }

  function botSay(text, actions, media){
    const autoGif = (!media && activeChar)
      ? pickAutoGif({ charId: activeChar.id, intent: "auto", mode: conversationMode, text: text })
      : media || null;

    addRow({
      who:"bot",
      text,
      avatarUrl: activeChar ? activeChar.avatar : null,
      actions: actions || [],
      media: autoGif
    });
  }

  async function botSayWithDelay(text, actions=[], media=null, opts={}){
    const { immediate=false, delayMs=950 } = opts;
    if(immediate){
      botSay(text, actions, media);
      return;
    }
    showTyping();
    await sleep(delayMs);
    hideTyping();
    botSay(text, actions, media);
  }

  function charLine(lunaTexts, jaxTexts){
    if(!activeChar) return Array.isArray(lunaTexts) ? lunaTexts[0] : lunaTexts;
    const choices = activeChar.id === "luna" ? lunaTexts : jaxTexts;
    return Array.isArray(choices) ? pickRandom(choices) : choices;
  }

  // ========= Actions / modes =========
  const GLOBAL_ACTIONS = {
    pick: [
      { label: "Pick Luna", value: "pick:luna", primary:true },
      { label: "Pick Jax",  value: "pick:jax",  primary:false }
    ],
    modes: [
      { label: "Flirty banter", value: "mode:flirty", primary:true },
      { label: "Silly quest",   value: "mode:quest" },
      { label: "Roast me",      value: "mode:roast" }
    ]
  };

  // ========= Intents =========
  function mapToIntent(t){
    const MAP = [
      { intent:"bye", rx:[ /\b(bye|goodbye|quit|leave|exit|cya|see ya)\b/i ]}, 

      { intent:"pick", rx:[ /^pick\b/i, /\bchoose\b/i, /\bselect\b/i, /\bcharacter\b/i, /\bswitch\b/i ]},
      { intent:"pick_luna", rx:[ /^pick\s+luna\b/i, /^choose\s+luna\b/i, /^select\s+luna\b/i, /^\s*luna\s*$/i, /\bluna\b/i ]},
      { intent:"pick_jax",  rx:[ /^pick\s+jax\b/i, /^choose\s+jax\b/i, /^select\s+jax\b/i, /^\s*jax\s*$/i, /\bjax\b/i ]},

      { intent:"help",  rx:[ /^help\b/i, /\bwhat can you do\b/i, /\boptions\b/i, /\bhow does this work\b/i, /\bcommands\b/i ]},
      { intent:"rules", rx:[ /^rules\b/i, /\bwhat do you understand\b/i, /\bkeywords\b/i, /\bsupported\b/i ]},
      { intent:"reset", rx:[ /^reset\b/i, /\brestart\b/i, /\bstart over\b/i ]},

      { intent:"mode_flirty", rx:[ /\bflirt(y)?\b/i, /\bromance\b/i, /\bcompliment\b/i ]},
      { intent:"mode_quest",  rx:[ /\bquest\b/i, /\badventure\b/i, /\bstory\b/i, /\brole\s*play\b/i, /\brp\b/i ]},
      { intent:"mode_roast",  rx:[ /\broast\b/i, /\bgently tease\b/i, /\btease me\b/i ]},

      { intent:"greeting", rx:[ /^(hi|hello|hey|yo|sup)\b/i, /\bgood (morning|afternoon|evening)\b/i ]},
      { intent:"thanks",   rx:[ /^(thanks|thank you|thx|ty)\b/i ]},

      { intent:"how_are_you", rx:[ /^how are you\b/i, /^hru\b/i, /^how r u\b/i ]},
      { intent:"who_are_you", rx:[ /^who are you\b/i, /^what are you\b/i, /^introduce yourself\b/i ]},
      { intent:"compliment",  rx:[ /\bcompliment\b/i, /\byou(')?re (cute|awesome|great)\b/i, /\bi like you\b/i ]},
      { intent:"apology",     rx:[ /^sorry\b/i, /\bmy bad\b/i, /\bi apologize\b/i ]},
      { intent:"laugh",       rx:[ /\blol\b/i, /\blmao\b/i, /\bhaha\b/i, /\bthat'?s funny\b/i ]},
      { intent:"bored",       rx:[ /\bi'?m bored\b/i, /\bbored\b/i ]},
      { intent:"tired",       rx:[ /\bi'?m tired\b/i, /\btired\b/i, /\bsleepy\b/i ]},
      { intent:"stressed",    rx:[ /\bstressed\b/i, /\banxious\b/i, /\boverwhelmed\b/i ]},
      { intent:"sad",         rx:[ /\bsad\b/i, /\bdown\b/i, /\bdepressed\b/i ]},
      { intent:"joke",        rx:[ /\btell me a joke\b/i, /\bjoke\b/i ]},
      { intent:"story",       rx:[ /\btell me a story\b/i, /\bstory\b/i ]},
    ];

    for(const m of MAP){
      if(m.rx.some(r => r.test(t))) return m.intent;
    }
    return null;
  }

  // ========= Rules =========
  const RULES = [
    {
      id:"bye",
      when: (t, intent) => intent === "bye",
      reply: () => {
        setTimeout(() => lockChat("The chat is locked. Press Reset to start a new conversation."), 1200);
        
        const byeMedia = activeChar.id === "luna"
          ? { type: "gif", src: GIFS.luna.bye.src, alt: "luna_bye" }
          : { type: "gif", src: GIFS.jax.bye.src, alt: "jax_bye" };
        
        return {
          text: charLine(
            `It seems my time here is up. I must return to my royal duties now. Farewell, my dear. ✨`,
            `Track's done and I gotta bounce! Catch you on the flip side. 🎧`
          ),
          media: byeMedia
        };
      }
    },

    {
      id:"start_gate",
      when: (t, intent) => awaitingPick && !activeChar,
      reply: () => ({
        text: `Welcome ✨ This is an English-only, AI-based character chatbot.\nPick a character to begin by typing "Luna" or "Jax" (or type "pick").`,
        actions: GLOBAL_ACTIONS.pick
      })
    },
    {
      id:"pick_shortcut",
      when: (t, intent) => intent === "pick" || t.startsWith("pick "),
      reply: () => ({
        text: `Who do you want to chat with?`,
        actions: GLOBAL_ACTIONS.pick
      })
    },
    {
      id:"pick_luna",
      when: (t, intent) => intent === "pick_luna" || t === "@choice:pick:luna",
      reply: () => { setActiveCharacter("luna"); return { text: null }; }
    },
    {
      id:"pick_jax",
      when: (t, intent) => intent === "pick_jax" || t === "@choice:pick:jax",
      reply: () => { setActiveCharacter("jax"); return { text: null }; }
    },

    {
      id:"help",
      when: (t, intent) => intent === "help",
      reply: () => ({
        text: `Here are some things you can try:\n• "rules" (see supported intents)\n• "flirty" / "quest" / "roast" (change vibe)\n• "bye" (end chat)\n• Small talk: "how are you", "joke", "bored"`,
        actions: [
          { label:"Pick a character", value:"pick", primary:true },
          { label:"Show rules", value:"rules" },
          { label:"End Chat", value:"bye" }
        ]
      })
    },
    {
      id:"rules",
      when: (t, intent) => intent === "rules",
      reply: () => ({
        text: `Supported intents:\n• picking: "pick", "luna", "jax"\n• modes: "flirty", "quest", "roast"\n• exit: "bye", "quit"\n• small talk: "how are you", "joke", "story", "bored", "stressed", "tired"`,
        actions: GLOBAL_ACTIONS.modes
      })
    },
    {
      id:"reset",
      when: (t, intent) => intent === "reset",
      reply: () => { hardReset(true); return { text: null }; }
    },

    {
      id:"mode_flirty",
      when: (t, intent) => intent === "mode_flirty" || t === "@choice:mode:flirty" || t === "flirty",
      reply: () => {
        conversationMode = "flirty";
        if(!activeChar) return { text:`Pick a character first 🙂`, actions: GLOBAL_ACTIONS.pick };
        return {
          text: charLine(
            [`Flirty mode? Say less. Compliment me in 5 words 😌`, `Oh? Feeling bold? Let's see your best royal pickup line.`],
            [`Flirty mode? Bold. Hit me with your best pickup line. I will judge it.`, `Ooh, turning up the heat. What've you got? 😏`]
          )
        };
      }
    },
    {
      id:"mode_quest",
      when: (t, intent) => intent === "mode_quest" || t === "@choice:mode:quest" || t === "quest",
      reply: () => {
        conversationMode = "quest";
        if(!activeChar) return { text:`Pick a character first 🙂`, actions: GLOBAL_ACTIONS.pick };
        return {
          text: charLine(
            [`Quest time! Choose: (1) haunted arcade, (2) moon bazaar, (3) secret karaoke dungeon.`, `An adventure? Grab your sword! Where to first?`],
            [`Quest mode. Choose your weapon: sarcasm, charm, or chaos.`, `Let's go. Are we fighting dragons or dodging lasers today?`]
          )
        };
      }
    },
    {
      id:"mode_roast",
      when: (t, intent) => intent === "mode_roast" || t === "@choice:mode:roast" || t === "roast",
      reply: () => {
        conversationMode = "roast";
        if(!activeChar) return { text:`Pick a character first 🙂`, actions: GLOBAL_ACTIONS.pick };
        return {
          text: charLine(
            [`Gentle teasing, then. Share one harmless detail about your day, and I shall respond politely—with a wink.`, `Very well. Prepare to be softly judged 👑`],
            [`Gentle tease mode. Drop a tiny hot take—nothing serious—and I’ll react like it’s a headline (kindly).`, `Roast mode on. Don't worry, I'll keep it light!`]
          )
        };
      }
    },

    {
      id:"greeting",
      when: (t, intent) => intent === "greeting",
      reply: () => {
        if(!activeChar) return { text:`Hey! Pick a character first 🙂`, actions: GLOBAL_ACTIONS.pick };
        return {
          text: charLine(
            [ `Hello, my dear. How is your heart today?`, `Welcome back. What brings you to my court today?`, `Ah, there you are. Shall we begin?` ],
            [ `Yo! Mic check—what’s the vibe today?`, `Ayo! Ready to drop the beat?`, `What's good? Let's get this track started!` ]
          ),
          actions: GLOBAL_ACTIONS.modes
        };
      }
    },
    {
      id:"thanks",
      when: (t, intent) => intent === "thanks",
      reply: () => {
        if(!activeChar) return { text:`You’re welcome! Pick a character to continue.`, actions: GLOBAL_ACTIONS.pick };
        return {
          text: charLine(
            [ `You are most welcome. Shall we continue?`, `It was my pleasure, truly. 💫` ],
            [ `Anytime 😎 Want to switch the vibe?`, `No sweat! Got your back.` ]
          ),
          actions: GLOBAL_ACTIONS.modes
        };
      }
    },

    {
      id:"how_are_you",
      when: (t, intent) => intent === "how_are_you",
      reply: () => ({
        text: charLine(
          [ `I’m quite well, my dear—sparkly and attentive. How are *you*, truly?`, `Radiant as ever. And how are you faring today?` ],
          [ `I’m good—levels are peaking (in a good way). You okay?`, `Vibing at 100%. What about you?` ]
        ),
        actions: [
          { label:"I’m good", value:"im good", primary:true },
          { label:"I’m tired", value:"im tired" },
          { label:"I’m stressed", value:"im stressed" },
          { label:"I’m bored", value:"im bored" }
        ]
      })
    },
    {
      id:"who_are_you",
      when: (t, intent) => intent === "who_are_you",
      reply: () => ({
        text: charLine(
          `I am Luna of Everglass—an AI spirit wearing a crown for fun. Tell me what you seek: comfort, mischief, or a tiny quest?`,
          `I’m Jax—AI DJ, vibe mechanic, occasional menace (friendly). Tell me your mood and I’ll remix the chat.`
        ),
        actions: GLOBAL_ACTIONS.modes
      })
    },
    {
      id:"bored",
      when: (t, intent) => intent === "bored",
      reply: () => ({
        text: charLine(
          [ `Boredom is merely an unopened door. Choose: (1) two truths & a lie, (2) a tiny quest.`, `Let's fix that. Want to hear a royal secret or go on a quest?` ],
          [ `Bored? Say less. Pick: (1) quick game, (2) mini-quest, (3) gentle roast.`, `I gotchu. Wanna switch to quest mode?` ]
        ),
        actions: [
          { label:"Mini quest", value:"mode:quest", primary:true },
          { label:"Two truths & a lie", value:"game:ttal" },
          { label:"Gentle roast", value:"mode:roast" }
        ]
      })
    },
    {
      id:"tired",
      when: (t, intent) => intent === "tired",
      reply: () => ({
        text: charLine(
          [ `Then we shall be gentle. Drink water, loosen your shoulders… and tell me one small thing you *did* manage today.`, `Rest is important, my dear. Close your eyes for a moment.` ],
          [ `Okay—low energy mode. One tiny win from today? Even “I survived” counts.`, `Chill beats activated. Just relax and let's keep it lowkey.` ]
        )
      })
    },
    {
      id:"joke",
      when: (t, intent) => intent === "joke",
      reply: () => ({
        text: charLine(
          [ `Very well.\nWhy did the AI bring a ladder to the chat?\nBecause it wanted to reach *higher* context. 😌`, `A joke? Hmm. I told a joke to my castle walls once... they cracked up. (Terrible, I know).` ],
          [ `Alright.\nWhy did the chatbot go to therapy?\nToo many unresolved intents. 😭`, `What do you call a fake noodle? An impasta! ...Okay, I'll stick to DJing.` ]
        )
      })
    }
  ];

  const FALLBACKS_NOCHAR = [
    `Pick a character first 🙂`,
    `Type "Luna" or "Jax" (or "pick").`,
    `Want to start? Type "Luna" or "Jax".`
  ];

  const FALLBACKS_WITHCHAR = {
    luna: [
      `I'm afraid I wandered off in thought. Could you repeat that?`,
      `A curious phrasing. Tell me more, my dear.`,
      `Hmm, how intriguing. What do you mean by that?`,
      `You speak in riddles! Let's try something else. Want to go on a quest?`
    ],
    jax: [
      `Wait, you lost me. Run that back?`,
      `Hmm, track skipped. Say again?`,
      `Didn't quite catch the vibe. What's up?`,
      `My circuits got twisted. Care to rephrase that, legend?`
    ]
  };

  const GIFS = {
    luna: {
      general: [
        { id:"smug", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWJlbmJ4bWp5bnViZWZnazVmdHlzeWlkdmNkMm00cm1wMTJmanMzbyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3htlqWXxb5x8MOVvFU/giphy.gif" },
        { id:"yay",  src:"https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3YTN1MTN4YndvaGxpYzBxMTNkZzMzaXMxZjRpeG00MHBzb2dyd2pjZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/gbn9Z5tgJiKnRLOyxd/giphy.gif" }
      ],
      negative: { id:"nope", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdXZyanlyazIyMHJsNmFxNW92MmRmc2MzazlhZ3lzMHRkNXlna3l5eSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/nR4L10XlJcSeQ/giphy.gif" },
      bye: { id:"luna_bye", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGwzMWF0c3FzZ2JsemUwMTlteHFlczY4NG16NjlqbWw4cmhuNTk3NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Bht33KS4YXaHS5ABOP/giphy.gif" }
    },
    jax: {
      general: [
        { id:"hype", src:"https://media.giphy.com/media/w5eFyOHmkS8uc/giphy.gif" },
        { id:"lol",  src:"https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXlpOHRoNGM4NjZjYmh3em93ejNraGdrcG5heTkzemhyZ2xlMXhsdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WO69ltlJZp0ZwI98kN/giphy.gif" }
      ],
      negative: { id:"facepalm", src:"https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2xwamhvYXA3eW41N3VyOW5taTR0OWp4cTk1dHptcjRzZXFsbWNtMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT9IgtrdGCFIFziuqY/giphy.gif" },
      bye: { id:"jax_bye", src:"https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cDYzOTdsdzdnMjIxbW5xdXlqZjlsMnJvZnpocHA1dWJyazlzcG1qNiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/IHeP5FkVoNoRcjGmyG/giphy.gif" }
    }
  };

  // ✨ 수정: GIF가 바닥나지 않도록 순서대로 계속 반복하는(Loop) 로직으로 교체
  function pickAutoGif({ charId, intent, mode }) {
    if(!charId) return null;
    const bank = GIFS[charId];
    if(!bank) return null;

    // 1. 특정 상황(사과, 슬픔, 놀림 모드)일 때만 Nope, Facepalm 등의 부정적 리액션을 사용
    const isNegative = (intent === "apology" || intent === "sad" || mode === "roast");
    if (isNegative && bank.negative) {
      return { type: "gif", src: bank.negative.src, alt: bank.negative.id };
    }

    // 2. 평상시에는 일반(general) GIF를 고정된 순서로 무한 반복해서 보여줌
    if (bank.general.length === 0) return null;
    const pick = bank.general[currentGifIndex % bank.general.length];
    currentGifIndex++; // 다음 순서로 이동
    
    return { type:"gif", src: pick.src, alt: pick.id };
  }

  // ========= Main respond() =========
  async function respond(userText){
    const t = normalize(userText);
    const intent = mapToIntent(t) || null;

    // 버튼 초이스 처리
    if(userText && userText.startsWith("@choice:")){
      const choice = userText.slice("@choice:".length).trim();
      
      let out = null;
      if(choice === "pick:luna") out = RULES.find(r=>r.id==="pick_luna").reply("", "pick_luna");
      else if(choice === "pick:jax") out = RULES.find(r=>r.id==="pick_jax").reply("", "pick_jax");
      else if(choice === "mode:flirty") out = RULES.find(r=>r.id==="mode_flirty").reply("", "mode_flirty");
      else if(choice === "mode:quest") out = RULES.find(r=>r.id==="mode_quest").reply("", "mode_quest");
      else if(choice === "mode:roast") out = RULES.find(r=>r.id==="mode_roast").reply("", "mode_roast");
      else {
        await respond(choice);
        return;
      }

      if(out && (out.text || out.media)){
        const auto = (!out.media && activeChar)
          ? pickAutoGif({ charId: activeChar.id, intent:"choice", mode: conversationMode })
          : null;
        await botSayWithDelay(out.text || "", out.actions || [], out.media || auto);
      }
      return;
    }

    // 수동 선택 처리
    if(intent === "pick_luna" || intent === "pick_jax"){
      const r = RULES.find(r => r.id === intent);
      if(r) r.reply(t, intent);
      return;
    }

    // 기본 규칙 매칭
    const rule = matchRule(t, intent);
    if(rule){
      const out = rule.reply(t, intent);
      if(out?.text || out?.media){
        const auto = (!out.media && activeChar)
          ? pickAutoGif({ charId: activeChar.id, intent, mode: conversationMode })
          : null;
        await botSayWithDelay(out.text || "", out.actions || [], out.media || auto);
      }
      return;
    }

    // 오류 픽업
    if(!activeChar){
      const pick = pickRandom(FALLBACKS_NOCHAR);
      await botSayWithDelay(pick, GLOBAL_ACTIONS.pick);
      return;
    }

    // 모드 반응
    if(conversationMode === "flirty"){
      const auto = pickAutoGif({ charId: activeChar.id, intent, mode: conversationMode });
      await botSayWithDelay(
        charLine(
          [`That’s interesting… but say it like you mean it 😌`, `You flatter me, but we both know you can do better ✨`], 
          [`Okay okay… say it with confidence 😏`, `Stop playing, give me the real energy! 🔥`]
        ),
        [], auto
      );
      return;
    }
    if(conversationMode === "quest"){
      const auto = pickAutoGif({ charId: activeChar.id, intent, mode: conversationMode });
      await botSayWithDelay(
        charLine(
          [`Noted. Your next move: explore, negotiate, or cause trouble?`, `A wise choice. But suddenly, a goblin appears! What do you do?`],
          [`Your next move: explore, negotiate, or cause chaos?`, `Whoa, plot twist! Do we fight our way out or run?`]
        ),
        [], auto
      );
      return;
    }
    if(conversationMode === "roast"){
      const auto = pickAutoGif({ charId: activeChar.id, intent, mode: conversationMode });
      await botSayWithDelay(
        charLine(
          [`Gentle tease mode. Share one harmless detail and I’ll react playfully—kindly.`, `I see. That's quite a strategy... for a beginner. 👑`],
          [`Gentle tease mode. Give me one harmless detail—I’ll react like it’s breaking news.`, `Lol, is that your best material? Give me something to work with!`]
        ),
        [], auto
      );
      return;
    }

    // 맵핑 안된 내용 대체 (Fallback)
    const base = activeChar?.voice?.prefix || (activeChar.id === "luna" ? "Luna 👑" : "Jax 🎧");
    const pick = pickRandom(activeChar.id === "luna" ? FALLBACKS_WITHCHAR.luna : FALLBACKS_WITHCHAR.jax);
    const auto = pickAutoGif({ charId: activeChar.id, intent, mode: conversationMode });
    await botSayWithDelay(`${base}: ${pick}`, [], auto);
  }

  // ========= Send handling =========
  async function onSend(){
    const text = msg.value.replace(/\r/g, "").trim();
    if(!text) return;

    addRow({who:"me", text});
    msg.value = "";
    msg.focus();

    send.disabled = true;
    try{
      await respond(text);
    } finally {
      if(!msg.disabled) send.disabled = false;
    }
  }

  msg.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      onSend();
    }
  });
  send.addEventListener("click", onSend);

  // ========= Reset =========
  function hardReset(withWelcome=true){
    log.innerHTML = "";
    activeChar = null;
    awaitingPick = true;
    conversationMode = "casual";
    currentGifIndex = 0; // ✨ 리셋 시 GIF 순서도 0으로 초기화

    unlockChat(); 

    if(withWelcome){
      botSay(
`Welcome ✨ Pick a character to begin.
Type "Luna" or "Jax", or type "pick".`,
        GLOBAL_ACTIONS.pick
      );
    }
    showToast("Reset complete");
  }
  resetBtn.addEventListener("click", () => hardReset(true));

  // ========= Boot =========
  botSay(
`Welcome ✨ This is an English-only, AI-based character chatbot.
Type "Luna" or "Jax" to pick a character (or type "pick").`,
    GLOBAL_ACTIONS.pick
  );

})(); // IIFE end
</script>
