<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Character Chat</title>
  <style>
    :root{
      --bg0:#07070c;
      --bg1:#0b1024;

      --card: rgba(18, 18, 30, .58);
      --card2: rgba(26, 24, 44, .58);
      --line: rgba(255,255,255,.12);

      --text:#f5f6ff;
      --muted: rgba(240,245,255,.68);

      --me: rgba(56, 189, 248, .16);
      --bot: rgba(236, 72, 153, .14);

      --pink: rgba(236,72,153,.95);
      --violet: rgba(139,92,246,.95);
      --cyan: rgba(56,189,248,.92);
      --lime: rgba(132,204,22,.90);

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 15% 5%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 15%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 700px at 50% 100%, rgba(139,92,246,.15), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow:hidden;
      overflow-y:auto;
    }

    .bokeh{
      position:fixed; inset:0; pointer-events:none; opacity:.65;
      background:
        radial-gradient(80px 80px at 10% 20%, rgba(236,72,153,.22), transparent 60%),
        radial-gradient(120px 120px at 70% 15%, rgba(56,189,248,.20), transparent 60%),
        radial-gradient(110px 110px at 85% 65%, rgba(139,92,246,.18), transparent 60%),
        radial-gradient(140px 140px at 20% 80%, rgba(132,204,22,.12), transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift{
      0%{transform:translate3d(0,0,0) scale(1)}
      100%{transform:translate3d(-12px, 10px,0) scale(1.03)}
    }

    .wrap{
      max-width:980px;
      width:100%;
      height:100%;
      margin:0 auto;
      padding:16px;
    }

    .card{
      width:100%;
      max-width:980px;
      height:100%;
      min-height:520px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(18px) saturate(140%);
      overflow:hidden;
      position:relative;
    }

    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        conic-gradient(from 180deg at 50% 50%,
          rgba(236,72,153,.55),
          rgba(139,92,246,.55),
          rgba(56,189,248,.55),
          rgba(132,204,22,.30),
          rgba(236,72,153,.55)
        );
      filter: blur(10px);
      opacity:.22;
      z-index:0;
      animation: spin 10s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    .cardInner{
      position:relative;
      width:100%;
      height:100%;
      background: linear-gradient(180deg, rgba(12,12,22,.78), rgba(8,8,14,.86));
      z-index:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(900px 240px at 10% 0%, rgba(236,72,153,.18), transparent 55%),
        radial-gradient(900px 240px at 90% 0%, rgba(56,189,248,.14), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      flex:0 0 auto;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .brandIcon{
      width:40px; height:40px; border-radius:14px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(236,72,153,.60), transparent 65%),
        radial-gradient(18px 18px at 70% 30%, rgba(56,189,248,.55), transparent 65%),
        radial-gradient(18px 18px at 50% 70%, rgba(139,92,246,.55), transparent 65%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      box-shadow: 0 12px 30px rgba(0,0,0,.40);
    }

    .brandText{min-width:0}
    .brandTitle{
      font-weight:900;
      letter-spacing:-.3px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chip{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      font-weight:800;
      font-size:12px;
      color: rgba(245,246,255,.92);
      cursor:pointer;
      user-select:none;
    }
    .chip:hover{filter:brightness(1.08)}

    .main{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns:1fr;
    }

    .panel{
      display:flex;
      flex-direction:column;
      height:100%;
      min-width:0;
      min-height:0;
    }

    .log{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:16px;
      background:
        radial-gradient(900px 600px at 30% 0%, rgba(236,72,153,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(56,189,248,.08), transparent 55%),
        linear-gradient(180deg, rgba(6,7,14,.55), rgba(6,7,14,.80));
      scroll-behavior:smooth;
    }

    .row{display:flex; gap:10px; margin:10px 0; align-items:flex-end}
    .row.me{justify-content:flex-end}
    .row > div{min-width:0}

    .avatar{
      width:38px;height:38px;
      border-radius:14px;
      flex:0 0 auto;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      box-shadow: 0 14px 32px rgba(0,0,0,.35);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    .bubble{
      display:inline-block;
      width:auto;
      max-width:100%;
      min-width:0;
      padding:12px 14px;
      border-radius:18px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:normal;
      color:var(--text);
      border:1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
      overflow-wrap:break-word;
    }

    .row.bot .bubble{
      background:
        radial-gradient(300px 140px at 20% 0%, rgba(236,72,153,.18), transparent 70%),
        linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    }

    .row.me .bubble{
      background:
        radial-gradient(300px 140px at 80% 0%, rgba(56,189,248,.16), transparent 70%),
        linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-color: rgba(56,189,248,.22);
    }

    .row.error .bubble{
      background: rgba(255,0,0,0.18);
      border-color: rgba(255,90,90,0.7);
      color: #ffd6d6;
    }

    .meta{
      margin-top:6px;
      font-size:11px;
      color: rgba(240,245,255,.62);
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .actionBtn{
      padding:9px 12px;
      border-radius:999px;
      cursor:pointer;
      font-weight:900;
      color: rgba(245,246,255,.95);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 22px rgba(0,0,0,.26);
      max-width:100%;
      min-width:0;
      flex:1 1 auto;
      white-space:normal;
      overflow-wrap:anywhere;
      transition:all 0.2s;
    }

    .actionBtn.primary{
      border:none;
      background: linear-gradient(135deg, rgba(236,72,153,.95), rgba(56,189,248,.92));
      box-shadow: 0 16px 34px rgba(236,72,153,.16);
    }

    .actionBtn:hover:not(:disabled){filter:brightness(1.1); transform:translateY(-1px);}
    .actionBtn:disabled{opacity:0.5; cursor:not-allowed;}

    .composer{
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex:0 0 auto;
    }

    textarea.input{
      flex:1;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      outline:none;
      font-size:14px;
      resize:none;
      line-height:1.4;
      min-height:52px;
      color:var(--text);
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 0 0 1px rgba(139,92,246,.08);
      transition:all 0.3s;
    }

    textarea.input::placeholder{color: rgba(240,245,255,.42)}
    textarea.input:disabled{opacity:.5; background: rgba(0,0,0,0.2); cursor:not-allowed;}

    .btn{
      padding:12px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:950;
      color:#fff;
      background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(236,72,153,.95));
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 16px 40px rgba(139,92,246,.20);
      transition:all 0.3s;
    }

    .btn:hover:not(:disabled){filter:brightness(1.1); transform:scale(1.02);}
    .btn:disabled{opacity:.4; cursor:not-allowed; filter:grayscale(0.5);}

    .typing{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:10px 12px;
      border-radius:16px;
      background: rgba(236,72,153,.14);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
    }

    .dot{
      width:6px;height:6px;border-radius:999px;
      background: radial-gradient(circle, rgba(251,207,232,1), rgba(236,72,153,1));
      box-shadow: 0 0 10px rgba(236,72,153,.55);
      animation:bounce 1.05s infinite ease-in-out;
      opacity:.9
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}

    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.55}
      40%{transform:translateY(-6px);opacity:1}
    }

    .toast{
      position:absolute;
      bottom:16px; left:50%;
      transform:translateX(-50%);
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(16,16,28,.65);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      font-size:12px;
      color: rgba(245,246,255,.86);
      display:none;
      z-index:6;
    }

    @media (max-width: 480px){
      .wrap{
        transform: scale(0.92);
        transform-origin: top center;
      }
      .log{max-height:460px;}
      textarea.input{
        font-size:13px;
        min-height:44px;
      }
      .btn{padding:10px 12px;}
    }
  </style>
</head>
<body>
  <div class="bokeh"></div>

  <div class="wrap">
    <div class="card">
      <div class="cardInner">

        <div class="topbar">
          <div class="brand">
            <div class="brandIcon" aria-hidden="true">✨</div>
            <div class="brandText">
              <div class="brandTitle" id="appTitle">AI Character Chatbot</div>
            </div>
          </div>
          <div class="chip" id="resetBtn" title="Reset">
            <span>↻</span><span>Reset</span>
          </div>
        </div>

        <div class="main">
          <section class="panel">
            <div class="log" id="log"></div>

            <div class="composer">
              <textarea
                class="input"
                id="msg"
                rows="2"
                placeholder='Enter = send, Shift+Enter = new line. Example: "pick", "Luna", or "Jax".'></textarea>
              <button class="btn" id="send">Send</button>
            </div>
          </section>
        </div>

        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  const msg = $("msg");
  const send = $("send");
  const resetBtn = $("resetBtn");
  const toast = $("toast");

  const state = {
    activeChar: null,
    awaitingPick: true,
    conversationMode: "casual",
    isLocked: false,
    isProcessing: false,
    typingEl: null,
    currentGifIndex: 0
  };

  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function normalize(text) {
    return (text || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function showToast(text) {
    toast.textContent = text;
    toast.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      toast.style.display = "none";
    }, 1800);
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      log.scrollTop = log.scrollHeight;
    });
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function svgAvatarDataURI(config) {
    const { bgA, bgB, emoji, accent } = config;
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="${bgA}"/>
            <stop offset="1" stop-color="${bgB}"/>
          </linearGradient>
          <radialGradient id="r" cx="30%" cy="25%" r="70%">
            <stop offset="0" stop-color="${accent}" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="128" height="128" rx="34" fill="url(#g)"/>
        <rect width="128" height="128" rx="34" fill="url(#r)"/>
        <circle cx="64" cy="70" r="36" fill="rgba(255,255,255,0.88)"/>
        <text x="64" y="78" font-size="40" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
      </svg>
    `;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
  }

  const Characters = [
    {
      id: "luna",
      name: "Luna",
      tagline: "Princess of Everglass Castle",
      description: "Regal, warm, and playful in a gentle way.",
      avatar: svgAvatarDataURI({ bgA:"#ec4899", bgB:"#8b5cf6", emoji:"👑", accent:"#fbcfe8" }),
      prefix: "Luna 👑"
    },
    {
      id: "jax",
      name: "Jax",
      tagline: "Neon Club DJ & Hype Captain",
      description: "Fast, upbeat, and rhythm-obsessed.",
      avatar: svgAvatarDataURI({ bgA:"#38bdf8", bgB:"#22c55e", emoji:"🎧", accent:"#cffafe" }),
      prefix: "Jax 🎧"
    }
  ];

  const GIFS = {
    luna: {
      general: [
        { id:"smug", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWJlbmJ4bWp5bnViZWZnazVmdHlzeWlkdmNkMm00cm1wMTJmanMzbyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3htlqWXxb5x8MOVvFU/giphy.gif" },
        { id:"yay", src:"https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3YTN1MTN4YndvaGxpYzBxMTNkZzMzaXMxZjRpeG00MHBzb2dyd2pjZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/gbn9Z5tgJiKnRLOyxd/giphy.gif" }
      ],
      negative: { id:"nope", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdXZyanlyazIyMHJsNmFxNW92MmRmc2MzazlhZ3lzMHRkNXlna3l5eSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/nR4L10XlJcSeQ/giphy.gif" },
      bye: { id:"luna_bye", src:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGwzMWF0c3FzZ2JsemUwMTlteHFlczY4NG16NjlqbWw4cmhuNTk3NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Bht33KS4YXaHS5ABOP/giphy.gif" }
    },
    jax: {
      general: [
        { id:"hype", src:"https://media.giphy.com/media/w5eFyOHmkS8uc/giphy.gif" },
        { id:"lol", src:"https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXlpOHRoNGM4NjZjYmh3em93ejNraGdrcG5heTkzemhyZ2xlMXhsdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WO69ltlJZp0ZwI98kN/giphy.gif" }
      ],
      negative: { id:"facepalm", src:"https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2xwamhvYXA3eW41N3VyOW5taTR0OWp4cTk1dHptcjRzZXFsbWNtMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT9IgtrdGCFIFziuqY/giphy.gif" },
      bye: { id:"jax_bye", src:"https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cDYzOTdsdzdnMjIxbW5xdXlqZjlsMnJvZnpocHA1dWJyazlzcG1qNiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/IHeP5FkVoNoRcjGmyG/giphy.gif" }
    }
  };

  const GLOBAL_ACTIONS = {
    pick: [
      { label: "Pick Luna", value: "pick:luna", primary: true },
      { label: "Pick Jax", value: "pick:jax", primary: false }
    ],
    modes: [
      { label: "Flirty banter", value: "mode:flirty", primary: true },
      { label: "Silly quest", value: "mode:quest" },
      { label: "Roast me", value: "mode:roast" }
    ]
  };

  const FALLBACKS_NOCHAR = [
    "Pick a character first 🙂",
    "Type \"Luna\" or \"Jax\" (or \"pick\").",
    "Want to start? Type \"Luna\" or \"Jax\"."
  ];

  const FALLBACKS_WITHCHAR = {
    luna: [
      "I'm afraid I wandered off in thought. Could you repeat that?",
      "A curious phrasing. Tell me more, my dear.",
      "Hmm, how intriguing. What do you mean by that?",
      "You speak in riddles. Shall we try a different vibe?"
    ],
    jax: [
      "Wait, you lost me. Run that back?",
      "Hmm, track skipped. Say again?",
      "Didn't quite catch the vibe. What's up?",
      "My circuits got twisted. Care to rephrase that, legend?"
    ]
  };

  function getIntroForCharacter(ch) {
    if (ch.id === "luna") {
      return "Welcome to Everglass Castle.\nTell me your purpose, and I shall respond with grace—wisdom, whimsy, or a playful quest.";
    }
    if (ch.id === "jax") {
      return "Yo—mic check! Welcome to the Neon Booth.\nGive me a topic and a vibe—chill, hype, or storytelling—and I’ll remix it.";
    }
    return "Hello.";
  }

  function getActiveCharacter() {
    return Characters.find(c => c.id === state.activeChar) || null;
  }

  function lockChat(reason) {
    state.isLocked = true;
    msg.disabled = true;
    send.disabled = true;
    msg.placeholder = reason || "Chat locked.";
    log.querySelectorAll(".actionBtn").forEach(btn => btn.disabled = true);
  }

  function unlockChat() {
    state.isLocked = false;
    msg.disabled = false;
    send.disabled = false;
    msg.placeholder = 'Enter = send, Shift+Enter = new line. Example: "pick", "Luna", or "Jax".';
  }

  function addRow({ who, text, avatarUrl, actions = [], media = null, isError = false }) {
    const row = document.createElement("div");
    row.className = "row " + (who === "me" ? "me" : "bot") + (isError ? " error" : "");

    if (who === "bot") {
      const av = document.createElement("div");
      av.className = "avatar";
      const img = document.createElement("img");
      img.alt = "Bot";
      img.src = avatarUrl || Characters[0].avatar;
      av.appendChild(img);
      row.appendChild(av);
    }

    const wrap = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (text) {
      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);
    }

    if (media && media.type === "gif" && media.src) {
      const img = document.createElement("img");
      img.src = media.src;
      img.alt = media.alt || "gif";
      img.loading = "lazy";
      img.style.display = "block";
      img.style.maxWidth = "260px";
      img.style.width = "100%";
      img.style.borderRadius = "14px";
      img.style.marginTop = text ? "10px" : "0";
      img.style.border = "1px solid rgba(255,255,255,.12)";
      bubble.appendChild(img);
    }

    if (who === "bot" && actions.length > 0) {
      const actionsEl = document.createElement("div");
      actionsEl.className = "actions";

      actions.forEach(action => {
        const b = document.createElement("button");
        b.className = "actionBtn " + (action.primary ? "primary" : "");
        b.textContent = action.label;
        b.disabled = state.isLocked || state.isProcessing;
        b.addEventListener("click", async () => {
          if (state.isLocked || state.isProcessing) return;
          addRow({ who: "me", text: action.label });
          await handleInput("@choice:" + (action.value || action.label));
        });
        actionsEl.appendChild(b);
      });

      bubble.appendChild(actionsEl);
    }

    wrap.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = nowTime();
    wrap.appendChild(meta);

    row.appendChild(wrap);
    log.appendChild(row);
    scrollToBottom();
  }

  function addSystemRow(text) {
    const row = document.createElement("div");
    row.className = "row bot";

    const wrap = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    bubble.style.opacity = ".85";
    bubble.style.fontSize = "13px";
    bubble.style.borderStyle = "dashed";
    bubble.style.background = "rgba(255,255,255,.04)";

    wrap.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = nowTime();
    wrap.appendChild(meta);

    row.appendChild(wrap);
    log.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    if (state.typingEl) return;

    const ch = getActiveCharacter();
    const row = document.createElement("div");
    row.className = "row bot";

    const av = document.createElement("div");
    av.className = "avatar";

    const img = document.createElement("img");
    img.alt = ch ? ch.name : "Bot";
    img.src = ch ? ch.avatar : Characters[0].avatar;
    av.appendChild(img);

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

    row.appendChild(av);
    row.appendChild(typing);
    state.typingEl = row;
    log.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    if (!state.typingEl) return;
    state.typingEl.remove();
    state.typingEl = null;
  }

  function pickAutoGif(intent) {
    const ch = getActiveCharacter();
    if (!ch) return null;

    const bank = GIFS[ch.id];
    if (!bank) return null;

    const negativeIntents = ["apology", "sad", "stressed"];
    if (negativeIntents.includes(intent) || state.conversationMode === "roast") {
      if (bank.negative) {
        return { type: "gif", src: bank.negative.src, alt: bank.negative.id };
      }
    }

    if (!bank.general || bank.general.length === 0) return null;
    const picked = bank.general[state.currentGifIndex % bank.general.length];
    state.currentGifIndex += 1;
    return { type: "gif", src: picked.src, alt: picked.id };
  }

  async function botSayWithDelay(text, actions = [], media = null, delayMs = 700) {
    showTyping();
    await sleep(delayMs);
    hideTyping();

    const ch = getActiveCharacter();
    addRow({
      who: "bot",
      text,
      avatarUrl: ch ? ch.avatar : Characters[0].avatar,
      actions,
      media
    });
  }

  function mapToIntent(t) {
    const patterns = [
      { intent: "bye", tests: [/^(bye|goodbye|quit|exit|leave|cya|see ya)\b/i] },
      { intent: "pick", tests: [/^pick\b/i, /\bchoose\b/i, /\bselect\b/i, /\bcharacter\b/i, /\bswitch\b/i] },
      { intent: "pick_luna", tests: [/^pick\s+luna\b/i, /^choose\s+luna\b/i, /^select\s+luna\b/i, /^\s*luna\s*$/i, /\bluna\b/i] },
      { intent: "pick_jax", tests: [/^pick\s+jax\b/i, /^choose\s+jax\b/i, /^select\s+jax\b/i, /^\s*jax\s*$/i, /\bjax\b/i] },
      { intent: "help", tests: [/^help\b/i, /\bwhat can you do\b/i, /\boptions\b/i, /\bcommands\b/i] },
      { intent: "rules", tests: [/^rules\b/i, /\bwhat do you understand\b/i, /\bsupported\b/i] },
      { intent: "reset", tests: [/^reset\b/i, /\brestart\b/i, /\bstart over\b/i] },
      { intent: "mode_flirty", tests: [/\bflirty\b/i, /\bflirt\b/i, /\bromance\b/i, /\bcompliment\b/i] },
      { intent: "mode_quest", tests: [/\bquest\b/i, /\badventure\b/i, /\bstory mode\b/i, /\brole ?play\b/i, /\brp\b/i] },
      { intent: "mode_roast", tests: [/\broast\b/i, /\btease me\b/i, /\bgently tease\b/i] },
      { intent: "greeting", tests: [/^(hi|hello|hey|yo|sup)\b/i, /\bgood (morning|afternoon|evening)\b/i] },
      { intent: "thanks", tests: [/^(thanks|thank you|thx|ty)\b/i] },
      { intent: "how_are_you", tests: [/^how are you\b/i, /^hru\b/i, /^how r u\b/i] },
      { intent: "who_are_you", tests: [/^who are you\b/i, /^what are you\b/i, /^introduce yourself\b/i] },
      { intent: "apology", tests: [/^sorry\b/i, /\bmy bad\b/i, /\bi apologize\b/i] },
      { intent: "laugh", tests: [/\blol\b/i, /\blmao\b/i, /\bhaha\b/i] },
      { intent: "bored", tests: [/\bi'?m bored\b/i, /\bbored\b/i] },
      { intent: "tired", tests: [/\bi'?m tired\b/i, /\btired\b/i, /\bsleepy\b/i] },
      { intent: "stressed", tests: [/\bstressed\b/i, /\banxious\b/i, /\boverwhelmed\b/i] },
      { intent: "sad", tests: [/\bsad\b/i, /\bdown\b/i, /\bdepressed\b/i] },
      { intent: "joke", tests: [/\btell me a joke\b/i, /^\s*joke\s*$/i] },
      { intent: "story", tests: [/\btell me a story\b/i, /^\s*story\s*$/i] }
    ];

    for (const group of patterns) {
      for (const rx of group.tests) {
        if (rx.test(t)) return group.intent;
      }
    }
    return null;
  }

  function setActiveCharacter(charId) {
    const ch = Characters.find(c => c.id === charId);
    if (!ch) return null;

    state.activeChar = ch.id;
    state.awaitingPick = false;
    state.currentGifIndex = 0;

    addSystemRow("You are now chatting with " + ch.name + ".");
    return ch;
  }

  async function routeReply(inputText) {
    const t = normalize(inputText);
    const intent = mapToIntent(t);

    if (inputText.startsWith("@choice:")) {
      const value = inputText.slice("@choice:".length).trim();

      if (value === "pick:luna") {
        const ch = setActiveCharacter("luna");
        await botSayWithDelay(getIntroForCharacter(ch), GLOBAL_ACTIONS.modes, pickAutoGif("greeting"));
        return;
      }

      if (value === "pick:jax") {
        const ch = setActiveCharacter("jax");
        await botSayWithDelay(getIntroForCharacter(ch), GLOBAL_ACTIONS.modes, pickAutoGif("greeting"));
        return;
      }

      if (value === "mode:flirty") {
        state.conversationMode = "flirty";
        if (!state.activeChar) {
          await botSayWithDelay("Pick a character first 🙂", GLOBAL_ACTIONS.pick);
          return;
        }
        await botSayWithDelay(
          getActiveCharacter().id === "luna"
            ? "Flirty mode? Say less. Compliment me in 5 words 😌"
            : "Flirty mode? Bold. Hit me with your best pickup line. I will judge it.",
          [],
          pickAutoGif("greeting")
        );
        return;
      }

      if (value === "mode:quest") {
        state.conversationMode = "quest";
        if (!state.activeChar) {
          await botSayWithDelay("Pick a character first 🙂", GLOBAL_ACTIONS.pick);
          return;
        }
        await botSayWithDelay(
          getActiveCharacter().id === "luna"
            ? "Quest time! Choose: haunted arcade, moon bazaar, or secret karaoke dungeon."
            : "Quest mode. Choose your weapon: sarcasm, charm, or chaos.",
          [],
          pickAutoGif("story")
        );
        return;
      }

      if (value === "mode:roast") {
        state.conversationMode = "roast";
        if (!state.activeChar) {
          await botSayWithDelay("Pick a character first 🙂", GLOBAL_ACTIONS.pick);
          return;
        }
        await botSayWithDelay(
          getActiveCharacter().id === "luna"
            ? "Very well. Prepare to be softly judged 👑"
            : "Roast mode on. Don’t worry, I’ll keep it light.",
          [],
          pickAutoGif("laugh")
        );
        return;
      }

      await routeReply(value);
      return;
    }

    if (intent === "reset") {
      hardReset(true);
      return;
    }

    if (intent === "bye") {
      const ch = getActiveCharacter();
      const byeMedia = ch ? { type: "gif", src: GIFS[ch.id].bye.src, alt: GIFS[ch.id].bye.id } : null;
      await botSayWithDelay(
        ch && ch.id === "luna"
          ? "It seems my time here is up. I must return to my royal duties now. Farewell, my dear. ✨"
          : ch && ch.id === "jax"
          ? "Track's done and I gotta bounce! Catch you on the flip side. 🎧"
          : "Goodbye.",
        [],
        byeMedia
      );
      lockChat("The chat is locked. Press Reset to start a new conversation.");
      return;
    }

    if (!state.activeChar) {
      if (intent === "pick" || intent === "pick_luna" || t === "luna") {
        const ch = setActiveCharacter("luna");
        await botSayWithDelay(getIntroForCharacter(ch), GLOBAL_ACTIONS.modes, pickAutoGif("greeting"));
        return;
      }

      if (intent === "pick_jax" || t === "jax") {
        const ch = setActiveCharacter("jax");
        await botSayWithDelay(getIntroForCharacter(ch), GLOBAL_ACTIONS.modes, pickAutoGif("greeting"));
        return;
      }

      await botSayWithDelay(
        "Welcome ✨ This is an English-only, AI-based character chatbot.\nPick a character to begin by typing \"Luna\" or \"Jax\" (or type \"pick\").",
        GLOBAL_ACTIONS.pick
      );
      return;
    }

    const ch = getActiveCharacter();

    if (intent === "help") {
      await botSayWithDelay(
        "Here are some things you can try:\n• \"rules\"\n• \"flirty\" / \"quest\" / \"roast\"\n• \"bye\"\n• Small talk: \"how are you\", \"joke\", \"bored\"",
        [
          { label:"Show rules", value:"rules", primary:true },
          { label:"Flirty banter", value:"mode:flirty" },
          { label:"Silly quest", value:"mode:quest" }
        ],
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "rules") {
      await botSayWithDelay(
        "Supported intents:\n• picking: \"pick\", \"luna\", \"jax\"\n• modes: \"flirty\", \"quest\", \"roast\"\n• exit: \"bye\", \"quit\"\n• small talk: \"how are you\", \"joke\", \"story\", \"bored\", \"stressed\", \"tired\"",
        GLOBAL_ACTIONS.modes,
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "pick" || intent === "pick_luna" || intent === "pick_jax") {
      await botSayWithDelay(
        "You’re already chatting with " + ch.name + ". Want to switch vibes instead?",
        GLOBAL_ACTIONS.modes,
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "mode_flirty") {
      state.conversationMode = "flirty";
      await botSayWithDelay(
        ch.id === "luna"
          ? "Oh? Feeling bold? Let’s see your best royal pickup line."
          : "Ooh, turning up the heat. What’ve you got? 😏",
        [],
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "mode_quest") {
      state.conversationMode = "quest";
      await botSayWithDelay(
        ch.id === "luna"
          ? "An adventure? Grab your sword. Where to first?"
          : "Let’s go. Are we fighting dragons or dodging lasers today?",
        [],
        pickAutoGif("story")
      );
      return;
    }

    if (intent === "mode_roast") {
      state.conversationMode = "roast";
      await botSayWithDelay(
        ch.id === "luna"
          ? "Gentle teasing, then. Share one harmless detail about your day."
          : "Gentle tease mode. Drop a tiny hot take—nothing serious.",
        [],
        pickAutoGif("laugh")
      );
      return;
    }

    if (intent === "greeting") {
      await botSayWithDelay(
        ch.id === "luna"
          ? pickRandom([
              "Hello, my dear. How is your heart today?",
              "Welcome back. What brings you to my court today?",
              "Ah, there you are. Shall we begin?"
            ])
          : pickRandom([
              "Yo! Mic check—what’s the vibe today?",
              "Ayo! Ready to drop the beat?",
              "What’s good? Let’s get this track started!"
            ]),
        GLOBAL_ACTIONS.modes,
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "thanks") {
      await botSayWithDelay(
        ch.id === "luna"
          ? pickRandom([
              "You are most welcome. Shall we continue?",
              "It was my pleasure, truly. 💫"
            ])
          : pickRandom([
              "Anytime 😎 Want to switch the vibe?",
              "No sweat! Got your back."
            ]),
        GLOBAL_ACTIONS.modes,
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "how_are_you") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "I’m quite well, my dear—sparkly and attentive. How are you, truly?"
          : "I’m good—levels are peaking. You okay?",
        [
          { label:"I’m good", value:"im good", primary:true },
          { label:"I’m tired", value:"im tired" },
          { label:"I’m stressed", value:"im stressed" },
          { label:"I’m bored", value:"im bored" }
        ],
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "who_are_you") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "I am Luna of Everglass—an AI spirit wearing a crown for fun. Tell me what you seek: comfort, mischief, or a tiny quest?"
          : "I’m Jax—AI DJ, vibe mechanic, occasional menace. Tell me your mood and I’ll remix the chat.",
        GLOBAL_ACTIONS.modes,
        pickAutoGif("greeting")
      );
      return;
    }

    if (intent === "bored") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "Boredom is merely an unopened door. Choose: mini quest or a royal secret?"
          : "Bored? Say less. Pick: quick game, mini-quest, or gentle roast.",
        [
          { label:"Mini quest", value:"mode:quest", primary:true },
          { label:"Gentle roast", value:"mode:roast" },
          { label:"Flirty banter", value:"mode:flirty" }
        ],
        pickAutoGif("story")
      );
      return;
    }

    if (intent === "tired") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "Then we shall be gentle. Drink water, loosen your shoulders… and tell me one small thing you managed today."
          : "Okay—low energy mode. One tiny win from today? Even “I survived” counts.",
        [],
        pickAutoGif("sad")
      );
      return;
    }

    if (intent === "stressed" || intent === "sad") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "I’m sorry the day feels heavy. Take one slow breath with me. You do not need to carry everything at once."
          : "That sounds rough. Let’s keep it simple—one breath, one step, one small win. I’m here.",
        [],
        pickAutoGif(intent)
      );
      return;
    }

    if (intent === "apology") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "You are forgiven before the sentence is finished."
          : "You’re good. No drama here.",
        [],
        pickAutoGif("apology")
      );
      return;
    }

    if (intent === "joke") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "Why did the AI bring a ladder to the chat?\nBecause it wanted to reach higher context. 😌"
          : "Why did the chatbot go to therapy?\nToo many unresolved intents. 😭",
        [],
        pickAutoGif("laugh")
      );
      return;
    }

    if (intent === "story") {
      await botSayWithDelay(
        ch.id === "luna"
          ? "Once upon a midnight in Everglass, a glowing key appeared on the castle stairs. Do you pick it up?"
          : "Alright, here’s your story starter: neon rain, a broken speaker, and one suspicious text at 2 a.m. What do we do first?",
        [
          { label:"Pick it up", value:"story:yes", primary:true },
          { label:"Ignore it", value:"story:no" }
        ],
        pickAutoGif("story")
      );
      return;
    }

    if (state.conversationMode === "flirty") {
      await botSayWithDelay(
        ch.id === "luna"
          ? pickRandom([
              "That’s interesting… but say it like you mean it 😌",
              "You flatter me, but we both know you can do better ✨"
            ])
          : pickRandom([
              "Okay okay… say it with confidence 😏",
              "Stop playing, give me the real energy! 🔥"
            ]),
        [],
        pickAutoGif("greeting")
      );
      return;
    }

    if (state.conversationMode === "quest") {
      await botSayWithDelay(
        ch.id === "luna"
          ? pickRandom([
              "Noted. Your next move: explore, negotiate, or cause trouble?",
              "A wise choice. But suddenly, a goblin appears. What do you do?"
            ])
          : pickRandom([
              "Your next move: explore, negotiate, or cause chaos?",
              "Whoa, plot twist. Do we fight our way out or run?"
            ]),
        [],
        pickAutoGif("story")
      );
      return;
    }

    if (state.conversationMode === "roast") {
      await botSayWithDelay(
        ch.id === "luna"
          ? pickRandom([
              "Gentle tease mode. Share one harmless detail and I’ll react playfully.",
              "I see. That’s quite a strategy… for a beginner. 👑"
            ])
          : pickRandom([
              "Gentle tease mode. Give me one harmless detail—I’ll react like it’s breaking news.",
              "Lol, is that your best material? Give me something to work with!"
            ]),
        [],
        pickAutoGif("laugh")
      );
      return;
    }

    await botSayWithDelay(
      ch.prefix + ": " + pickRandom(FALLBACKS_WITHCHAR[ch.id]),
      GLOBAL_ACTIONS.modes,
      pickAutoGif("greeting")
    );
  }

  async function handleInput(rawText) {
    if (state.isLocked || state.isProcessing) return;
    state.isProcessing = true;
    send.disabled = true;
    log.querySelectorAll(".actionBtn").forEach(btn => btn.disabled = true);

    try {
      await routeReply(rawText);
    } catch (err) {
      hideTyping();
      addRow({
        who: "bot",
        text: "⚠️ Error: " + (err && err.message ? err.message : String(err)),
        isError: true,
        avatarUrl: Characters[0].avatar
      });
      console.error(err);
    } finally {
      state.isProcessing = false;
      if (!state.isLocked) {
        send.disabled = false;
        log.querySelectorAll(".actionBtn").forEach(btn => btn.disabled = false);
      }
      msg.focus();
    }
  }

  async function onSend() {
    const text = msg.value.replace(/\r/g, "").trim();
    if (!text || state.isLocked || state.isProcessing) return;

    addRow({ who: "me", text });
    msg.value = "";
    await handleInput(text);
  }

  function hardReset(withWelcome = true) {
    log.innerHTML = "";
    state.activeChar = null;
    state.awaitingPick = true;
    state.conversationMode = "casual";
    state.isLocked = false;
    state.isProcessing = false;
    state.currentGifIndex = 0;
    hideTyping();
    unlockChat();

    if (withWelcome) {
      addRow({
        who: "bot",
        text: "Welcome ✨ This is an English-only, AI-based character chatbot.\nType \"Luna\" or \"Jax\" to pick a character (or type \"pick\").",
        avatarUrl: Characters[0].avatar,
        actions: GLOBAL_ACTIONS.pick
      });
    }

    showToast("Reset complete");
    msg.focus();
  }

  msg.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      await onSend();
    }
  });

  send.addEventListener("click", onSend);
  resetBtn.addEventListener("click", () => hardReset(true));

  hardReset(true);
})();
</script>
</body>
</html>
